name: tudla
services:
  app:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
    environment:
      PORT: 3100
      DEMO_ONLY: "true"
      EMBEDDED_WORKER: "false"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
